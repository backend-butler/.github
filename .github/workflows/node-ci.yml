# Reusable check for every Node project in the org:
#   jobs:
#     ci:
#       uses: backend-butler/.github/.github/workflows/node-ci.yml@main
#       with: { working-directory: backend_butler }
name: Node CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder holding package.json and package-lock.json
        type: string
        default: "."
      check-dist:
        description: Fail if the build changes committed files (for repos that ship built output)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install (dependency scripts blocked)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built output is committed
        if: ${{ inputs.check-dist }}
        run: git diff --exit-code -- . || (echo "::error::Run npm run build and commit the result." && exit 1)
